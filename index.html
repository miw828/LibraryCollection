<div class="top">

            <button class="book book-btn" data-title="Murder in a Blue Moon" data-author="Margot Neville" data-description="A classic Crime Club mystery of murder, moonlight, and a broken string of pearls." data-image="Screenshot 2026-10-27 131536.png"></button>

        </div>

        <div class="shelf">
            <div class="book"></div>
            <button class="book book-btn" data-title="The Last Trumpet" data-author="Todd Downing" data-description="A murder in a Mexican bull ring sets off an investigation where nothing is as it seems." data-image="Screenshot 2026-10-27 131606.png"></button>

        <div class="shelf">

            <div class="book"></div>
            <button class="book book-btn" data-title="In Re: Sherlock Holmes" data-author="August Derleth" data-description="Pastiche mysteries in the classic Sherlock Holmes tradition, starring Derleth's Holmes-inspired detective Solar Pons." data-image="Screenshot 2026-10-27 120722.png"></button>
            <div class="book"></div>
            <div class="book"></div>
        </div>

        <div class="shelf">
            <div class="book"></div>

            <div class="book"></div>
            <button class="book book-btn" data-title="In Re: Sherlock Holmes" data-author="August Derleth" data-description="Pastiche mysteries in the classic Sherlock Holmes tradition, starring Derleth's Holmes-inspired detective Solar Pons." data-image="Screenshot 2026-10-27 120722.png"></button>
        </div>
    </div>

    <!-- Third row -->
    <div class="shelf-row">
        <div class="shelf">
            <div class="book"></div>
            <div class="book"></div>
            <div class="book"></div>

            <div class="book"></div>
            <div class="book"></div>

        <div class="shelf">
            <div class="book"></div>

            <button class="book book-btn" data-title="The Girl with the Dragon Tattoo" data-author="Stieg Larsson" data-description="A disgraced journalist and a brilliant hacker investigate the decades-old disappearance of a young woman from a wealthy family." data-image="Screenshot 2026-10-27 125516.png"></button>

        <div class="shelf">
            <div class="book"></div>

</div>

<div class="modal" id="modal" data-background-image="secondModalImage.jpg" hidden>
    <button class="modal-close" id="modal-close" aria-label="Close">X</button>
    <div class="modal-top">
        <div class="modal-spine" id="modal-spine"></div>
        <div class="modal-info">
            <h3>Title: <span id="modal-title"></span></h3>
            <h3>Author: <span id="modal-author"></span></h3>
        </div>
    </div>
    <div class="modal-image">
        <img id="modal-img" src="" alt="" hidden>
        <span class="modal-image-placeholder" id="modal-img-placeholder">Picture goes here</span>
    </div>
    <h3>Description: </h3>
    <p id="modal-description"></p>
    <span class="modal-bg-placeholder">Background image goes here</span>
</div>
